<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050d1b">
<title>JARVIS AI</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; background: #050d1b; color: #e9faff; font-family: Arial, sans-serif; }
.app { max-width: 650px; margin: auto; min-height: 100dvh; display: flex; flex-direction: column; padding: 24px 16px; }
h1 { color: #00d9ff; text-align: center; letter-spacing: 5px; }
.status { text-align: center; color: #7defff; }
.orb { width: 170px; height: 170px; border: 3px solid #00d9ff; border-radius: 50%; margin: 35px auto; box-shadow: 0 0 35px #008cff; display: grid; place-items: center; color: #00d9ff; font-size: 45px; }
.chat { flex: 1; overflow-y: auto; padding: 15px; border: 1px solid #176080; border-radius: 15px; min-height: 180px; }
.message { margin: 12px 0; }
.controls { display: flex; gap: 8px; margin-top: 15px; }
input { flex: 1; min-width: 0; padding: 14px; border-radius: 10px; border: none; font-size: 16px; }
button { background: #00bfe8; border: none; border-radius: 10px; padding: 14px; font-size: 17px; }
</style>
</head>
<body>
<div class="app">
<h1>J.A.R.V.I.S.</h1>
<div class="status">SYSTEM ONLINE</div>
<div class="orb">✦</div>
<div class="chat" id="chat"><div class="message">JARVIS: Hello! How can I help you?</div></div>
<div class="controls">
<input id="message" placeholder="Ask JARVIS...">
<button onclick="sendMessage()">Send</button>
<button onclick="speak()">🎙️</button>
</div>
</div>
<script>
const input = document.getElementById("message");
const chat = document.getElementById("chat");
function addMessage(who, text) {
 const div = document.createElement("div");
 div.className = "message";
 div.textContent = who + ": " + text;
 chat.appendChild(div);
 chat.scrollTop = chat.scrollHeight;
}
function sendMessage() {
 const text = input.value.trim();
 if (!text) return;
 addMessage("You", text);
 input.value = "";
 addMessage("JARVIS", "AI connection coming soon.");
}
function speak() {
 addMessage("JARVIS", "Voice setup coming soon.");
}
input.addEventListener("keydown", e => {
 if (e.key === "Enter") sendMessage();
});
</script>
</body>
</html>
